<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rohan Patel, Flutter developer in Richmond, Virginia. Cross-platform apps for mobile and web.">
  <meta name="theme-color" content="#FF3D7F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rohan Patel">
  <!-- Opaque and unrounded: iOS applies its own corner mask. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png"/>

  <title>Rohan Patel - Flutter developer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Netlify's build bot only parses static HTML for forms, and Flutter Web
    renders everything to canvas/DOM at runtime — this form is never shown,
    but its presence here is what makes Netlify register the "contact" form
    and relay submissions to the address configured in the site's Forms
    settings. The real UI lives in lib/pages/contact_page.dart, which POSTs
    to this same form name.
  -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="tel" name="phone">
    <textarea name="message"></textarea>
    <input type="text" name="bot-field">
  </form>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
